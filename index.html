<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vesta Group — Campaign Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0e12;
  --bg2:#13161c;
  --bg3:#1a1e26;
  --bg4:#212630;
  --border:rgba(255,255,255,0.06);
  --border2:rgba(255,255,255,0.11);
  --border3:rgba(255,255,255,0.22);
  --text:#e8eaf0;
  --text2:#9aa3b2;
  --text3:#555e6e;
  --banan:#f5c842;
  --banan-bg:rgba(245,200,66,0.1);
  --ttr:#5b8ef0;
  --ttr-bg:rgba(91,142,240,0.1);
  --green:#34d399;
  --green-bg:rgba(52,211,153,0.1);
  --red:#f87171;
  --red-bg:rgba(248,113,113,0.1);
  --orange:#fb923c;
  --orange-bg:rgba(251,146,60,0.1);
  --purple:#a78bfa;
  --purple-bg:rgba(167,139,250,0.1);
  --pink:#f472b6;
  --pink-bg:rgba(244,114,182,0.1);
  --font:'DM Sans',sans-serif;
  --mono:'DM Mono',monospace;
  --r:10px;--r-sm:6px;
  --shadow:0 1px 4px rgba(0,0,0,0.3);
  --shadow-md:0 4px 16px rgba(0,0,0,0.4);
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}

/* HEADER */
header{background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 32px;box-shadow:var(--shadow)}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:13px 0 10px}
.brand-logo{display:flex;align-items:center;gap:10px}
.brand-icon{width:30px;height:30px;border-radius:8px;background:var(--text);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0c0e12;letter-spacing:-.5px}
.brand-name{font-size:14px;font-weight:600;color:var(--text)}
.brand-sub{font-size:11px;color:var(--text3);font-family:var(--mono)}
.header-right{display:flex;align-items:center;gap:14px}
.live-badge{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--text3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2.5s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.tabs{display:flex;gap:2px}
.tab-btn{padding:0 20px;font-family:var(--font);font-size:13px;font-weight:500;border:none;background:transparent;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;transition:all .2s;height:42px;display:flex;align-items:center;gap:7px}
.tab-btn:hover{color:var(--text2)}
.tab-btn.active[data-brand="Banan"]{color:var(--banan);border-bottom-color:var(--banan)}
.tab-btn.active[data-brand="TTR"]{color:var(--ttr);border-bottom-color:var(--ttr)}

/* MAIN */
main{padding:24px 32px;max-width:1440px;margin:0 auto}

/* FILTER */
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:20px;background:var(--bg2);padding:10px 14px;border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);flex-wrap:wrap}
.filter-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-right:2px}
select,input[type=date]{background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:var(--font);font-size:12px;padding:5px 10px;border-radius:var(--r-sm);cursor:pointer;outline:none;transition:border-color .15s;color-scheme:dark}
select:focus,input[type=date]:focus{border-color:var(--border3)}
.filter-divider{width:1px;height:18px;background:var(--border2)}
.date-sep{font-size:11px;color:var(--text3)}
.btn-sm{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);font-family:var(--font);font-size:11px;padding:5px 11px;border-radius:var(--r-sm);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.btn-sm:hover{border-color:var(--border3);color:var(--text)}
.btn-sm.spinning svg{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.filter-right{margin-left:auto;display:flex;gap:6px}

/* SECTION */
.section-header{display:flex;align-items:center;gap:12px;margin:24px 0 12px}
.section-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.14em;white-space:nowrap}
.section-rule{flex:1;height:1px;background:var(--border)}

/* KPI CARDS */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi-grid-2{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:border-color .2s,transform .15s}
.kpi-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.kpi-accent{position:absolute;top:0;left:0;right:0;height:2px;border-radius:var(--r) var(--r) 0 0}
.kpi-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;margin-top:3px}
.kpi-value{font-size:24px;font-weight:600;line-height:1.1;margin-bottom:8px;font-family:var(--mono);color:var(--text)}
.kpi-footer{display:flex;align-items:center;justify-content:space-between;gap:6px}
.kpi-sub{font-size:10px;color:var(--text3);font-family:var(--mono)}
.delta{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;font-family:var(--mono)}
.delta.up{background:var(--green-bg);color:var(--green)}
.delta.down{background:var(--red-bg);color:var(--red)}
.delta.flat{color:var(--text3)}

/* CHARTS */
.charts-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.charts-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.chart-card-title{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px}
.chart-card-sub{font-size:10px;color:var(--text3);font-family:var(--mono);margin-bottom:14px}
.chart-wrap{position:relative}

/* METRIC TOGGLE */
.metric-toggle{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mtbtn{background:var(--bg3);border:1px solid var(--border);color:var(--text3);font-family:var(--mono);font-size:10px;padding:4px 10px;border-radius:4px;cursor:pointer;transition:all .2s}
.mtbtn:hover{border-color:var(--border2);color:var(--text2)}
.mtbtn.active{border-color:var(--border2);background:var(--bg4);color:var(--text);font-weight:500;box-shadow:var(--shadow)}

/* DEEP DIVE */
.deepdive-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.deepdive-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.deepdive-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border);background:var(--bg3)}
.deepdive-title{font-size:12px;font-weight:600;color:var(--text)}
.dd-tabs{display:flex;gap:4px}
.dd-tab{background:transparent;border:1px solid var(--border2);color:var(--text3);font-family:var(--font);font-size:10px;padding:3px 9px;border-radius:4px;cursor:pointer;transition:all .15s}
.dd-tab:hover{color:var(--text2)}
.dd-tab.active{background:var(--bg4);border-color:var(--border3);color:var(--text);font-weight:500}
.deepdive-body{padding:10px 12px}
.perf-row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;transition:background .1s}
.perf-row:hover{background:var(--bg3)}
.perf-rank{font-family:var(--mono);font-size:10px;color:var(--text3);min-width:14px;text-align:right}
.perf-name{font-size:11px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.perf-bar-wrap{width:52px;height:3px;background:var(--bg4);border-radius:2px;flex-shrink:0}
.perf-bar{height:100%;border-radius:2px;transition:width .5s ease}
.perf-value{font-family:var(--mono);font-size:10px;color:var(--text2);min-width:62px;text-align:right}

/* TABLE */
.table-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.table-head{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border);background:var(--bg3);flex-wrap:wrap;gap:8px}
.table-title{font-size:12px;font-weight:600;color:var(--text)}
.table-meta{font-size:10px;color:var(--text3);font-family:var(--mono)}
.sort-bar{display:flex;gap:4px}
.sort-btn{background:transparent;border:1px solid var(--border2);color:var(--text3);font-family:var(--font);font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;transition:all .15s}
.sort-btn:hover{color:var(--text2)}
.sort-btn.active{background:var(--bg4);border-color:var(--border3);color:var(--text);font-weight:500}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:11px}
th{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;background:var(--bg3)}
th:hover{color:var(--text2)}
th.sort-asc::after{content:' ↑';opacity:.5}
th.sort-desc::after{content:' ↓';opacity:.5}
td{padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.mono{font-family:var(--mono);font-size:10px;color:var(--text2)}
.muted{font-size:10px;color:var(--text3)}

/* BADGES */
.badge{display:inline-block;font-size:9px;padding:2px 6px;border-radius:3px;font-weight:700;font-family:var(--mono)}
.badge-traffic{background:var(--ttr-bg);color:var(--ttr)}
.badge-ctm{background:var(--banan-bg);color:var(--banan)}
.badge-awareness{background:var(--purple-bg);color:var(--purple)}
.badge-other{background:rgba(255,255,255,.06);color:var(--text3)}

.hook-badge{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:3px;font-weight:600}
.hook-good{background:var(--green-bg);color:var(--green)}
.hook-mid{background:var(--orange-bg);color:var(--orange)}
.hook-low{background:var(--red-bg);color:var(--red)}

/* SCORE PILL */
.score-pill{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
.score-hi{background:var(--green-bg);color:var(--green)}
.score-mid{background:var(--orange-bg);color:var(--orange)}
.score-lo{background:var(--red-bg);color:var(--red)}
.score-na{color:var(--text3)}

/* BEST FOR */
.best-tags{display:flex;gap:3px;flex-wrap:wrap}
.best-tag{display:inline-flex;align-items:center;gap:3px;font-size:9px;padding:2px 6px;border-radius:3px;font-weight:600;white-space:nowrap}
.best-awareness{background:rgba(167,139,250,.15);color:var(--purple)}
.best-conv{background:rgba(52,211,153,.15);color:var(--green)}
.best-visit{background:rgba(244,114,182,.15);color:var(--pink)}
.best-hook{background:rgba(251,146,60,.15);color:var(--orange)}
.best-ctr{background:rgba(91,142,240,.15);color:var(--ttr)}
.best-cpa{background:rgba(245,200,66,.15);color:var(--banan)}

/* NOTE */
.note-bar{background:rgba(245,200,66,.07);border:1px solid rgba(245,200,66,.2);border-radius:var(--r-sm);padding:8px 14px;font-size:11px;color:rgba(245,200,66,.8);margin-bottom:16px;line-height:1.6}

/* LOADING / ERROR */
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px;gap:14px;color:var(--text3)}
.spinner{width:26px;height:26px;border:2px solid var(--border2);border-top-color:var(--text2);border-radius:50%;animation:spin .8s linear infinite}
.error-state{background:var(--bg2);border:1px solid rgba(248,113,113,.2);border-radius:var(--r);padding:28px;text-align:center;color:var(--red)}
.error-state p{margin-top:8px;font-size:12px;color:var(--text3)}

@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.kpi-grid-2{grid-template-columns:repeat(2,1fr)}.charts-grid,.deepdive-grid{grid-template-columns:1fr}}
@media(max-width:720px){header,main{padding-left:16px;padding-right:16px}.kpi-grid,.kpi-grid-2{grid-template-columns:repeat(2,1fr)}.charts-grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="brand-logo">
      <div class="brand-icon">VG</div>
      <div>
        <div class="brand-name">Vesta Group</div>
        <div class="brand-sub">Campaign Dashboard 2026</div>
      </div>
    </div>
    <div class="header-right">
      <div class="live-badge"><div class="dot"></div><span id="update-time">Loading…</span></div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-brand="Banan" onclick="switchBrand('Banan',this)">🍌 Banan</button>
    <button class="tab-btn" data-brand="TTR" onclick="switchBrand('TTR',this)">📚 TTR</button>
  </div>
</header>

<main id="main-content">
  <div class="loading-state"><div class="spinner"></div><span>Loading data…</span></div>
</main>

<script>
// ── Config ──
const SHEET_ID='1wqArly1SMp4ahfnccMT1nKYal9A_VDg-DsIF8gRBkLA';
// Sử dụng gviz/tq kèm gid=0 để tránh dính lỗi bảo mật CORS trên GitHub Pages công khai
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=0&_=${Date.now()}`;

let allData=[],currentBrand='Banan',charts={};
let sortCol='spend',sortDir=-1;
let ddTab={visit:'format',conv:'format'};
let trendMetric='spend';

// ── CSV Parser ──
function parseCSVLine(line){
  const r=[];let c='',q=false;
  for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){q=!q}else if(ch===','&&!q){r.push(c);c=''}else c+=ch}
  r.push(c);return r;
}
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l => l.trim() !== '');
  if(lines.length === 0) return [];
  const headers=parseCSVLine(lines[0]).map(h => h.trim());
  
  console.log("📊 Đồng bộ thành công! Google Sheet chứa các cột sau:", headers);

  return lines.slice(1).map(l=>{
    const v=parseCSVLine(l),o={};
    headers.forEach((h,i)=>o[h]=(v[i]||'').trim());
    
    // Đọc cột ngày tháng 'Day' thay vì 'Date'
    if(o['Day'] && o['Day'].includes('/')){
      const p=o['Day'].split('/');
      if(p.length===3){
        if(p[0].length === 4){
          o['Day']=`${p[0]}-${p[1].padStart(2,'0')}-${p[2].padStart(2,'0')}`;
        } else {
          let day = p[0];
          let month = p[1];
          let year = p[2];
          if(parseInt(month) > 12){
            let temp = day;
            day = month;
            month = temp;
          }
          o['Day']=`${year}-${month.padStart(2,'0')}-${day.padStart(2,'0')}`;
        }
      }
    }
    return o;
  });
}
function num(r,col){return parseFloat((r[col]||'0').replace(/,/g,''))||0}

// ── Formatters ──
function fmt(n){if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return Math.round(n/1e3)+'K';return Math.round(n).toLocaleString()}
function fmtVND(n){if(n>=1e9)return(n/1e9).toFixed(2)+'B ₫';if(n>=1e6)return(n/1e6).toFixed(1)+'M ₫';if(n>=1e3)return Math.round(n/1e3)+'K ₫';return Math.round(n).toLocaleString()+'₫'}
function fmtPct(n){if(n===null||isNaN(n)||!isFinite(n))return'—';return n.toFixed(1)+'%'}
function mkDelta(curr,prev,lowerBetter=false){
  if(!prev||prev===0)return`<span class="delta flat">—</span>`;
  const p=((curr-prev)/prev)*100;
  const good=lowerBetter?p<=0:p>=0;
  const cls=Math.abs(p)<0.5?'flat':good?'up':'down';
  return`<span class="delta ${cls}">${p>=0?'↑':'↓'}${Math.abs(p).toFixed(1)}%</span>`;
}

// ── Aggregate ──
function aggregate(rows){
  const imp=rows.reduce((s,r)=>s+num(r,'Impressions'),0);
  const spend=rows.reduce((s,r)=>s+num(r,'Amount spent (VND)'),0);
  const clicks=rows.reduce((s,r)=>s+num(r,'Link clicks'),0);
  const convs=rows.reduce((s,r)=>s+num(r,'Messaging conversations started'),0);
  const igVisit=rows.reduce((s,r)=>s+num(r,'Instagram profile visits'),0);
  const vid3s=rows.reduce((s,r)=>s+num(r,'3-second video plays'),0);
  
  // Tự động gộp dữ liệu kết quả (Results) dựa trên data thực tế có trên sheet
  const results=rows.reduce((s,r)=>s + (num(r,'Results') || num(r,'Messaging conversations started') || num(r,'Instagram profile visits')), 0);

  return{
    imp,spend,clicks,results,convs,igVisit,vid3s,
    cpm:imp>0?spend/imp*1000:0,
    cpc:clicks>0?spend/clicks:0,
    cpConv:convs>0?spend/convs:0,
    cpIG:igVisit>0?spend/igVisit:0,
    ctr:imp>0?clicks/imp*100:0,
    cvr:clicks>0?convs/clicks*100:0,
    hookRate:imp>0?vid3s/imp*100:0,
    cpa:results>0?spend/results:0,
  };
}

// ── HƯỚNG 1: Tính Điểm Hiệu Suất Tương Đối Của Batch ──
function buildScoreCtx(crMap){
  const vals=Object.values(crMap).filter(d=>d.spend>0);
  const avg=arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
  return{
    avgCPM:avg(vals.filter(d=>d.imp>0).map(d=>d.spend/d.imp*1000)),
    avgCTR:avg(vals.filter(d=>d.imp>0).map(d=>d.clicks/d.imp)),
    avgCPA:avg(vals.filter(d=>d.results>0).map(d=>d.spend/d.results)),
    avgCVR:avg(vals.filter(d=>d.clicks>0).map(d=>d.convs/d.clicks)),
  };
}
function effScore(d,ctx){
  if(!d.spend||!ctx)return null;
  const thisCPM=d.imp>0?d.spend/d.imp*1000:null;
  const thisCTR=d.imp>0?d.clicks/d.imp:null;
  const thisCPA=d.results>0?d.spend/d.results:null;
  const thisCVR=d.clicks>0?d.convs/d.clicks:null;
  let total=0,weight=0;
  if(thisCPM&&ctx.avgCPM>0){total+=Math.min(2,ctx.avgCPM/thisCPM)*0.25;weight+=0.25}
  if(thisCTR&&ctx.avgCTR>0){total+=Math.min(2,thisCTR/ctx.avgCTR)*0.35;weight+=0.35}
  if(thisCPA&&ctx.avgCPA>0){total+=Math.min(2,ctx.avgCPA/thisCPA)*0.25;weight+=0.25}
  if(thisCVR&&ctx.avgCVR>0){total+=Math.min(2,thisCVR/ctx.avgCVR)*0.15;weight+=0.15}
  if(!weight)return null;
  return Math.min(100,Math.round((total/weight)*50));
}
function scorePill(s){
  if(s===null)return`<span class="score-na">—</span>`;
  const cls=s>=70?'score-hi':s>=40?'score-mid':'score-lo';
  const icon=s>=70?'↑':s>=40?'→':'↓';
  return`<span class="score-pill ${cls}">${icon} ${s}</span>`;
}

// ── HƯỚNG 2: Tự Động Gắn Nhãn Best For ──
function buildBestFor(crMap){
  const entries=Object.entries(crMap).filter(([,d])=>d.spend>0);
  const tag=(sorted,n,key,label,cls)=>{
    sorted.slice(0,n).forEach(([name])=>{
      if(!bestFor[name])bestFor[name]=[];
      bestFor[name].push({label,cls});
    });
  };
  const bestFor={};
  const byCPM=entries.filter(([,d])=>d.imp>0).sort((a,b)=>(a[1].spend/a[1].imp)-(b[1].spend/b[1].imp));
  tag(byCPM,3,'cpm','📢 Awareness','best-awareness');
  const byConv=entries.filter(([,d])=>d.convs>0).sort((a,b)=>(a[1].spend/a[1].convs)-(b[1].spend/b[1].convs));
  tag(byConv,3,'cpconv','💬 Conv','best-conv');
  const byVisit=entries.filter(([,d])=>d.igVisit>0).sort((a,b)=>(a[1].spend/a[1].igVisit)-(b[1].spend/b[1].igVisit));
  tag(byVisit,3,'cpig','📸 IG Visit','best-visit');
  const byHook=entries.filter(([,d])=>d.vid3s>0&&d.imp>0).sort((a,b)=>(b[1].vid3s/b[1].imp)-(a[1].vid3s/a[1].imp));
  tag(byHook,3,'hook','🎣 Hook','best-hook');
  const byCTR=entries.filter(([,d])=>d.imp>0).sort((a,b)=>(b[1].clicks/b[1].imp)-(a[1].clicks/a[1].imp));
  tag(byCTR,3,'ctr','🖱 CTR','best-ctr');
  const byCPA=entries.filter(([,d])=>d.results>0).sort((a,b)=>(a[1].spend/a[1].results)-(b[1].spend/b[1].results));
  tag(byCPA,3,'cpa','🏆 CPA','best-cpa');
  return bestFor;
}
function bestForCell(tags){

function hookBadge(p){
  if(p===null||p===undefined)return'—';
  const cls=p>=25?'hook-good':p>=10?'hook-mid':'hook-low';
  return`<span class="hook-badge ${cls}">${p.toFixed(1)}%</span>`;
}
function badgeClass(obj){
  if(!obj)return'badge-other';
  const o=obj.toLowerCase();
  if(o.includes('traffic'))return'badge-traffic';
  if(o.includes('ctm')||o.includes('message'))return'badge-ctm';
  if(o.includes('aware'))return'badge-awareness';
  return'badge-other';
}
function thCls(col){return col===sortCol?(sortDir===-1?'sort-desc':'sort-asc'):''}

function deepDiveRows(data,metric,groupCol){
  const map={};
  data.forEach(r=>{
    const k=r[groupCol]||'Unknown';
    if(!map[k])map[k]={spend:0,imp:0,clicks:0,results:0,convs:0,igVisit:0,vid3s:0};
    map[k].spend+=num(r,'Amount spent (VND)');
    map[k].imp+=num(r,'Impressions');
    map[k].clicks+=num(r,'Link clicks');
    map[k].convs+=num(r,'Messaging conversations started');
    map[k].igVisit+=num(r,'Instagram profile visits');
    map[k].vid3s+=num(r,'3-second video plays');
    map[k].results+=num(r,'Results') || num(r,'Messaging conversations started') || num(r,'Instagram profile visits');
  });
  const getVal=v=>{switch(metric){
    case'igVisit':return v.igVisit;
    case'conv':return v.convs;
    case'cpi':return v.igVisit>0?v.spend/v.igVisit:Infinity;
    case'cpconv':return v.convs>0?v.spend/v.convs:Infinity;
    case'ctr':return v.imp>0?v.clicks/v.imp*100:0;
    case'hook':return v.imp>0?v.vid3s/v.imp*100:0;
    default:return v.spend;
  }};
  const lower=['cpi','cpconv'].includes(metric);
  const sorted=Object.entries(map).filter(([,v])=>v.spend>0)
    .sort((a,b)=>lower?getVal(a[1])-getVal(b[1]):getVal(b[1])-getVal(a[1])).slice(0,6);
  const maxVal=sorted[0]?getVal(sorted[0][1]):1;
  const minVal=sorted[sorted.length-1]?getVal(sorted[sorted.length-1][1]):0;
  return sorted.map(([name,v],i)=>{
    const val=getVal(v);
    const bw=lower
      ?(maxVal===minVal?100:Math.max(8,Math.round((1-(val-minVal)/(maxVal-minVal+1))*100)))
      :(maxVal>0?Math.round(val/maxVal*100):0);
    let display;
    if(['cpi','cpconv','spend'].includes(metric))display=fmtVND(Math.round(isFinite(val)?val:0));
    else if(['ctr','hook'].includes(metric))display=fmtPct(val);
    else display=fmt(val);
    return{rank:i+1,name,bw,display};
  });
}
function renderDD(rows,color){
  if(!rows.length)return`<div style="padding:16px;text-align:center;font-size:11px;color:var(--text3)">No data</div>`;
  return rows.map(r=>`<div class="perf-row">
    <span class="perf-rank">${r.rank}</span>
    <span class="perf-name" title="${r.name}">${r.name}</span>
    <div class="perf-bar-wrap"><div class="perf-bar" style="width:${r.bw}%;background:${color}"></div></div>
    <span class="perf-value">${r.display}</span>
  </div>`).join('');
}

// ── Kết nối và tải dữ liệu ──
async function loadData(){
  try {
    const res=await fetch(CSV_URL);
    if(!res.ok)throw new Error('HTTP '+res.status+' — Hãy mở cài đặt Google Sheet thành: Bất kỳ ai có liên kết đều xem được.');
    const text=await res.text();
    if(!text.includes(','))throw new Error('Định dạng bảng sai hoặc rỗng — hãy kiểm tra lại file dữ liệu.');
    
    // Quét và kết nối dữ liệu cột thương hiệu cùng cột ngày 'Day' mới
    allData=parseCSV(text).filter(r=>r['Brand'] && r['Day']);
    
    if(allData.length === 0) {
      throw new Error("Không hút được hàng dữ liệu nào. Hãy kiểm tra chữ hoa thường ở cột 'Brand' và cột 'Day'.");
    }

    document.getElementById('update-time').textContent='Updated '+new Date().toLocaleTimeString('vi-VN');
    render();
  } catch(e) {
    document.getElementById('main-content').innerHTML=`<div class="error-state"><strong>Lỗi đồng bộ dữ liệu Google Sheet</strong><p>${e.message}</p></div>`;
  }
}

function switchBrand(brand,btn){
  currentBrand=brand;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function getFilters(){return{
  month:document.getElementById('filter-month')?.value||'all',
  activity:document.getElementById('filter-activity')?.value||'all',
  objective:document.getElementById('filter-objective')?.value||'all',
  dateFrom:document.getElementById('filter-date-from')?.value||'',
  dateTo:document.getElementById('filter-date-to')?.value||'',
}}
function applyFilters(data){
  const f=getFilters();
  return data.filter(r=>{
    if(f.month!=='all'&&r['Month']!==f.month)return false;
    if(f.activity!=='all'&&r['Activities']!==f.activity)return false;
    if(f.objective!=='all'&&r['Objective']!==f.objective)return false;
    if(f.dateFrom&&r['Day']<f.dateFrom)return false;
    if(f.dateTo&&r['Day']>f.dateTo)return false;
    return true;
  });
}
function setSort(col){sortCol===col?sortDir*=-1:(sortCol=col,sortDir=-1);render()}
function setDDTab(panel,tab){ddTab[panel]=tab;render()}
function setTrendMetric(m){trendMetric=m;render()}
function clearDates(){['filter-date-from','filter-date-to'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});render()}
function refreshData(){
  const btn=document.getElementById('refresh-btn');
  if(btn)btn.classList.add('spinning');
  allData=[];
  document.getElementById('main-content').innerHTML=`<div class="loading-state"><div class="spinner"></div><span>Refreshing…</span></div>`;
  loadData().finally(()=>{const b=document.getElementById('refresh-btn');if(b)b.classList.remove('spinning')});
}

    </div>
    <div class="charts-grid-2" style="margin-bottom:24px">
      <div class="chart-card">
        <div class="chart-card-title">IG Visit Profile — daily</div>
        <div class="chart-card-sub">Profile visits per day</div>
        <div class="chart-wrap" style="height:140px"><canvas id="chart-igvisit"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-card-title">Conversation — daily</div>
        <div class="chart-card-sub">Conversations started per day</div>
        <div class="chart-wrap" style="height:140px"><canvas id="chart-conv"></canvas></div>
      </div>
    </div>

    <div class="section-header"><span class="section-label">Deep dive</span><div class="section-rule"></div></div>
    <div class="deepdive-grid" style="margin-bottom:24px">
      <div class="deepdive-card">
        <div class="deepdive-head">
          <div class="deepdive-title">IG Visit Profile — Best performers</div>
          <div class="dd-tabs">
            <button class="dd-tab${ddTab.visit==='format'?' active':''}" onclick="setDDTab('visit','format')">By Format</button>
            <button class="dd-tab${ddTab.visit==='creative'?' active':''}" onclick="setDDTab('visit','creative')">By Creative</button>
          </div>
        </div>
        <div class="deepdive-body">${renderDD(ddIG,'#34d399')}</div>
      </div>
      <div class="deepdive-card">
        <div class="deepdive-head">
          <div class="deepdive-title">Conversation — Best performers</div>
          <div class="dd-tabs">
            <button class="dd-tab${ddTab.conv==='format'?' active':''}" onclick="setDDTab('conv','format')">By Format</button>
            <button class="dd-tab${ddTab.conv==='creative'?' active':''}" onclick="setDDTab('conv','creative')">By Creative</button>
          </div>
        </div>
        <div class="deepdive-body">${renderDD(ddConv,'#a78bfa')}</div>
      </div>
    </div>

    <div class="section-header"><span class="section-label">Creative performance table</span><div class="section-rule"></div></div>
    <div class="note-bar">
      <strong>Score</strong> (Option A) — so sánh mỗi creative với mức trung bình của batch hiện tại · CTR 35% · CPM 25% · CPA 25% · CVR 15% · Score 100 = tốt nhất trong period đang filter<br>
      <strong>Best For</strong> (Option B) — top 3 creatives per metric: 📢 Awareness (CPM) · 💬 Conv (Cost/Conv) · 📸 IG Visit (Cost/Visit) · 🎣 Hook Rate · 🖱 CTR · 🏆 CPA
    </div>
    <div class="table-card" style="margin-bottom:40px">
      <div class="table-head">
        <div>
          <div class="table-title">Top Creatives — full metrics</div>
          <div class="table-meta">${sortedCreatives.length} creatives · sorted by ${sortCol}</div>
        </div>
        <div class="sort-bar">${tableSortButtonsHtml}</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th onclick="setSort('spend')" class="${thCls('spend')}">Creative</th>
            <th>Objective</th>
            <th>Activity</th>
            <th>Format</th>
            <th onclick="setSort('spend')" class="${thCls('spend')}">Spend</th>
            <th onclick="setSort('imp')" class="${thCls('imp')}">Impressions</th>
            <th>CPM</th>
            <th onclick="setSort('clicks')" class="${thCls('clicks')}">Clicks</th>
            <th onclick="setSort('ctr')" class="${thCls('ctr')}">CTR</th>
            <th>IG Visit</th>
            <th>Cost/Visit</th>
            <th>Conv</th>
            <th>Cost/Conv</th>
            <th onclick="setSort('cpa')" class="${thCls('cpa')}">CPA</th>
            <th>CVR</th>
            <th onclick="setSort('hook')" class="${thCls('hook')}">Hook Rate</th>
            <th onclick="setSort('score')" class="${thCls('score')}">Score ↗</th>
            <th>Best For</th>
          </tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>
  `;

  // ── Đồ thị hiển thị trực quan ──
  Object.values(charts).forEach(c=>{try{c.destroy()}catch(_){}});charts={};
  const gc='rgba(255,255,255,0.04)';
  Chart.defaults.color='#555e6e';
  Chart.defaults.font.family="'DM Sans',sans-serif";
  Chart.defaults.font.size=11;
  const mkTT=(fmtFn)=>({backgroundColor:'#1a1e26',borderColor:'rgba(255,255,255,0.1)',borderWidth:1,padding:10,titleColor:'#e8eaf0',bodyColor:'#9aa3b2',callbacks:{label:ctx=>` ${fmtFn(ctx.raw)}`}});

  // Đồ thị xu hướng chính
  const ctxT=document.getElementById('chart-trend');
  if(ctxT&&sortedDates.length){
    const c=trendColor[trendMetric];
    const fmtFn=trendMetric==='spend'?v=>fmtVND(Math.round(v)):['ctr','hookRate'].includes(trendMetric)?v=>v.toFixed(2)+'%':v=>fmt(Math.round(v));
    charts.trend=new Chart(ctxT,{type:'line',data:{labels:dateValues,datasets:[{data:trendSets[trendMetric],borderColor:c,backgroundColor:c+'18',borderWidth:2,pointRadius:sortedDates.length>25?0:3,pointBackgroundColor:c,tension:.4,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:mkTT(fmtFn)},scales:{x:{grid:{color:gc},ticks:{maxRotation:0,maxTicksLimit:8}},y:{grid:{color:gc},ticks:{callback:fmtFn}}}}});
  }

  // Đồ thị hoạt động chi tiêu chiến dịch
  const ctxA=document.getElementById('chart-activity');
  if(ctxA){
    const acts=Object.keys(actSpend).sort((x,y)=>actSpend[y]-actSpend[x]);
    const pal=[accentHex,'#34d399','#a78bfa','#fb923c','#f87171','#5b8ef0','#f472b6'];
    charts.act=new Chart(ctxA,{type:'bar',data:{labels:acts,datasets:[{data:acts.map(ac=>actSpend[ac]),backgroundColor:acts.map((_,i)=>pal[i%pal.length]+'bb'),borderColor:acts.map((_,i)=>pal[i%pal.length]),borderWidth:1,borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:mkTT(v=>fmtVND(Math.round(v)))},scales:{x:{grid:{color:'transparent'},ticks:{font:{size:10}}},y:{grid:{color:gc},ticks:{callback:v=>fmtVND(v)}}}}});
  }

  // Đồ thị IG profile visits
  const ctxIG=document.getElementById('chart-igvisit');
  if(ctxIG){
    charts.ig=new Chart(ctxIG,{type:'line',data:{labels:dateValues,datasets:[{data:sortedDates.map(d=>byDate.igVisit[d]||0),borderColor:'#34d399',backgroundColor:'#34d39914',borderWidth:2,pointRadius:sortedDates.length>25?0:3,tension:.4,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:mkTT(v=>fmt(Math.round(v)))},scales:{x:{grid:{color:gc},ticks:{maxRotation:0,maxTicksLimit:6}},y:{grid:{color:gc}}}}});
  }

  // Đồ thị hội thoại tin nhắn mới
  const ctxC=document.getElementById('chart-conv');
  if(ctxC){
    charts.conv=new Chart(ctxC,{type:'line',data:{labels:dateValues,datasets:[{data:sortedDates.map(d=>byDate.convs[d]||0),borderColor:'#a78bfa',backgroundColor:'#a78bfa14',borderWidth:2,pointRadius:sortedDates.length>25?0:3,tension:.4,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:mkTT(v=>fmt(Math.round(v)))},scales:{x:{grid:{color:gc},ticks:{maxRotation:0,maxTicksLimit:6}},y:{grid:{color:gc}}}}});
  }
}

loadData();
</script>
</body>
</html>
